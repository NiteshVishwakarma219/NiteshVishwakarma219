<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#00A8E8" stop-opacity="0.55"/>
      <stop offset="75%" stop-color="#00A8E8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00A8E8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0066CC"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="140" cy="140" r="100"/>
    </clipPath>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- outer glow halo -->
  <circle cx="140" cy="140" r="130" fill="url(#glow)" filter="url(#softBlur)"/>

  <!-- rotating-style gradient ring -->
  <circle cx="140" cy="140" r="106" fill="none" stroke="url(#ring)" stroke-width="4" opacity="0.9"/>

  <!-- photo, clipped to circle -->
  <image xmlns:xlink="http://www.w3.org/1999/xlink" xlink:href="Nitesh-Photo.png" href="Nitesh-Photo.png" x="40" y="40" width="200" height="200" clip-path="url(#circleClip)" preserveAspectRatio="xMidYMid slice"/>

  <!-- thin inner border for crispness -->
  <circle cx="140" cy="140" r="100" fill="none" stroke="#0B0F14" stroke-width="2"/>
</svg>
